name: Unit Tests

on:
  push:
  pull_request:

jobs:
  unit:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ovn-tester/requirements.txt
    - name: ovn-fake-multinode-utils
      env:
        PYTHONPATH: ovn-fake-multinode-utils
      run: |
        python -m unittest discover \
          -s ovn-fake-multinode-utils/unit_tests -v
    - name: ovn-tester
      env:
        PYTHONPATH: ovn-tester
      run: |
        python -m unittest discover -s ovn-tester/unit_tests -v
